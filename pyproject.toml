[project]
name = "rgalerts"
version = "0.0.1"
description = "Recovery Giant: breakdown reports on the M25/M3/M4/A316 to Telegram"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mapbox-vector-tile>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rgalerts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
